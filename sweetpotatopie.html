<!DOCTYPE html>
<html>
<head>
<style>

/* 1. Hide the h1 element with no space taken */
h1 {
    display: none;
}

/* 2. Display list items as inline elements */
li {
    display: inline;
}

/* 3. Display strong elements as block elements */
strong {
    display: block;
}

/* 4. Set border to 2px solid green for table, th, td */
table, th, td {
    border: 2px solid green;
}

/* 5. Collapse table borders */
table {
    border-collapse: collapse;
}

/* 6. Align text in td elements to the right */
td {
    text-align: right;
}

</style>
</head>
<body>

<h1>This is a Heading</h1>

<p>This is a <strong>strong</strong> paragraph, with some words more <strong>important</strong> than others</p>

<p>This is another paragraph.</p>

<ul>
    <li>Apple</li>
    <li>Orange</li>
    <li>Pear</li>
</ul>

<table>
  <tr>
    <th>Firstname</th>
    <th>Lastname</th>
  </tr>
  <tr>
    <td>Peter</td>
    <td>Griffin</td>
  </tr>
  <tr>
    <td>Lois</td>
    <td>Griffin</td>
  </tr>
</table>

</body>
</html>
